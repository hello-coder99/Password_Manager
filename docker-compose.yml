services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${MYSQL_DATABASE:-aegisvault}
      MARIADB_USER: ${MYSQL_USER:-aegisvault_app}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly no
      --save ""
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-aegisvault_app}:${MYSQL_PASSWORD}@mariadb:3306/${MYSQL_DATABASE:-aegisvault}?charset=utf8mb4
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      RATELIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SESSION_LIFETIME_MINUTES: ${SESSION_LIFETIME_MINUTES:-30}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-524288}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net
    security_opt:
      - no-new-privileges:true

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true

networks:
  backend_net:
    driver: bridge
    internal: true
  frontend_net:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
